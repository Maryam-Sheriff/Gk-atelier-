# ─────────────────────────────────────────────────────────────────────────────
#  GK Atelier — website settings
#
#  This is the one place for contact details and launch switches.
#  Change only the text after the colon (:) and keep the spaces at the start
#  of each line exactly as they are. Text in quotes "like this" is fine.
#  Lines starting with # are notes and are ignored by the website.
# ─────────────────────────────────────────────────────────────────────────────

whatsapp:
  # Ghada's WhatsApp number in international format, DIGITS ONLY:
  # country code + number, with no "+", no spaces and no leading zero.
  #   Egypt: 20 followed by the mobile number without its first 0
  #          (a number written locally as 01XX XXX XXXX becomes 201XXXXXXXXX)
  # Until this is filled in, every WhatsApp button shows a "not set up yet"
  # notice instead of a link, and the release build refuses to run.
  number: "201067112862"

site:
  # The website's full address — used for every link on the site, product
  # links inside WhatsApp messages, search engines and social sharing.
  # Ghada's own domain, served by GitHub Pages (see README.md → Custom domain).
  url: "https://gkatelier.online"
  # The language visitors see first, at the main address: ar or en.
  # The other language lives under /en/ (or /ar/).
  default_language: ar

brand:
  # The GK Atelier logo exactly as supplied (transparent PNG or SVG).
  logo: images/brand/gk-atelier-logo.png
  # Smaller versions cut from the same logo, never redrawn or stretched:
  #   logo_monogram         the GK monogram, used in the menu and favicons
  #   logo_without_tagline  monogram + name, used on the homepage and footer
  #                         (the tagline is already written right next to it)
  #   logo_wordmark         just the name lines, "GK ATELIER / BY GHADA
  #                         KHALIL", used across the top of every page
  logo_monogram: images/brand/gk-atelier-monogram.png
  logo_without_tagline: images/brand/gk-atelier-logo-without-tagline.png
  logo_wordmark: images/brand/gk-atelier-wordmark.png
  # Square GK monogram for browser tabs and phone home screens.
  icon: images/brand/gk-atelier-icon.png
  # 1200 × 630 image shown when a page is shared on WhatsApp, Instagram,
  # Facebook, etc. Product pages use the product's own photo instead.
  share_image: images/brand/gk-atelier-share.jpg

homepage:
  # A collection to spotlight in its own band on the homepage (copy its slug
  # from collections.yml), e.g. ramadan before and during the holy month.
  # Leave empty ("") to hide the band.
  featured_collection: ramadan

social:
  # Full links to Ghada's real accounts. Leave empty ("") to hide an icon.
  instagram: ""
  facebook: ""
  tiktok: ""
  pinterest: ""

launch:
  # Set to true only after a fluent Arabic speaker has reviewed every Arabic
  # text on the site (content/copy/ar.yml, collections.yml and the products).
  arabic_reviewed: false
  # The products marked "sample: true" only demonstrated the product pages
  # before Ghada's real pieces were added. Keep this false (or delete the
  # sample-*.yml files); set it to true only to see the samples again.
  show_sample_products: false
