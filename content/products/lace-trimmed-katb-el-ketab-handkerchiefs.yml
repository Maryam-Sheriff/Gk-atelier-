description:
  en: >-
    Two katb el-ketab handkerchief designs for the marriage-contract ceremony,
    each edged in white lace and embroidered with the couple's names and the
    date in both the Gregorian and Hijri calendars, beneath a line of Arabic
    calligraphy. One shows a bride and groom inside a wreath of golden
    flowers, the bride's gown raised in lace; the other is framed by delicate
    embroidered branches.
  ar: >-
    تصميمان لمنديل كتب الكتاب لحفل عقد القران، لكلٍّ منهما إطار من الدانتيل
    الأبيض، وعليهما اسما العروسين والتاريخ بالتقويمين الميلادي والهجري تحت سطر من
    الخط العربي. يُظهر الأول عروسين داخل إكليل من الزهور الذهبية مع فستان بارز من
    الدانتيل، ويحيط بالثاني غصنان مطرّزان برقّة.
