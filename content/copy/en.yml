privacy:
  title: Privacy Notice
  description: How the GK Atelier website handles your information.
  heading: Privacy notice
  # Change this date whenever the privacy text changes (YYYY-MM-DD).
  updated_on: "2026-10-20"
  updated: "Last updated: {date}"
  sections:
    - title: In short
      text:
        - >-
          This website does not ask you to create an account, does not take
          payments and does not use advertising or analytics cookies.
    - title: Enquiry form and WhatsApp
      text:
        - >-
          When you use the project enquiry form, your details (such as your
          name, contact information and a description of your project) stay
          in your browser. Pressing the button places them into a WhatsApp
          message on your device. Nothing is sent until you choose to send
          that message yourself.
        - >-
          Once you send a message, it is shared with GK Atelier through
          WhatsApp and handled under WhatsApp's own terms and privacy policy.
          All enquiries are reviewed by Ghada or her team, and are used only
          to reply to your enquiry and arrange your order. An order is
          confirmed only after the relevant details are agreed.
        - >-
          Reference images are attached directly in WhatsApp — they are never
          uploaded to this website. Customer photographs and project
          references are never published without permission.
    - title: Information stored on your device
      text:
        - >-
          The website remembers your language choice (English or Arabic) in
          your browser's local storage, so the site opens in your language
          next time. You can clear it at any time from your browser settings.
    - title: Hosting
      text:
        - >-
          Like most websites, our hosting provider may keep standard technical
          logs (such as IP addresses and the pages requested) for security and
          to keep the website running.
    - title: Questions
      text:
        - >-
          If you have a question about your information, or would like your
          messages deleted, please contact the atelier on WhatsApp.

