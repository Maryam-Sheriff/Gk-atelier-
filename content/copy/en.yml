about:
  title: About Ghada Khalil — Artist, Educator and Artisan
  description: >-
    Meet Ghada Khalil, the artist and art educator behind GK Atelier, with over
    30 years of teaching experience and work alongside designers and wedding
    and eveningwear ateliers.
  eyebrow: About Ghada
  heading: Meet Ghada Khalil
  lead: >-
    An artist, educator, and artisan with a lifelong dedication to creativity
    and craftsmanship.
  work_caption: Pieces from the atelier
  story_title: Her story
  # Ghada's biography, paragraph by paragraph.
  bio:
    - >-
      For Ghada Khalil, handmade artistry is more than a skill. It is a world
      of creativity, experience, and attention to detail.
    - >-
      With over 30 years of experience teaching art, Ghada has spent decades
      developing an understanding of artistic techniques, materials,
      composition, and the creative process. Alongside her teaching career,
      she has worked with leading designer names across the Middle East and
      collaborated with numerous ateliers specializing in wedding gowns and
      evening gowns, contributing to the world of couture and decorative
      craftsmanship.
    - >-
      Her expertise extends far beyond one technique. From silk painting and
      embroidery to macramé, crochet, teriko, fabric flowers, and ready-made
      appliqués, Ghada brings artistic knowledge and practical experience to
      an extensive range of handmade creations.
    - >-
      She has worked with fabrics ranging from the most delicate materials to
      more challenging textiles, adapting her techniques to suit the material,
      the design, and the intended finish. Whether creating an intricate
      decorative detail, a personalized gift, or a bespoke textile piece, she
      approaches each project with care and a strong commitment to quality.
    - >-
      Today, Ghada leads a professional team of artisans who work under her
      supervision. This allows GK Atelier to combine personal attention to
      detail with the capacity to accommodate different production
      quantities, depending on the design and project requirements.
    - >-
      Her philosophy is simple: every piece deserves attention, skill, and
      heart. She believes that the smallest details can transform a creation,
      and that quality comes from understanding the materials, respecting the
      craft, and caring about the final result.
    - >-
      At GK Atelier, each project begins with an idea and becomes a creation
      shaped by experience, creativity, and a genuine love of handmade
      artistry.
  quote: Every piece deserves attention, skill, and heart.
  signoff: GK Atelier by Ghada Khalil. Handmade creations, thoughtfully made.
  highlights_title: Experience behind every piece
  crafts_eyebrow: Techniques
  crafts_title: A remarkable range of crafts
  crafts_text: Ghada brings artistic knowledge and practical experience to each of them.
  crafts:
    - Silk painting
    - Embroidery
    - Beadwork & embellishment
    - Macramé
    - Crochet
    - Teriko
    - Fabric flowers
    - Ready-made appliqués
  work_eyebrow: The work
  work_title: From the atelier
  process_title: Inside the atelier
  process_text: The workspace, the tools and the pieces as they take shape.
  cta_title: Have a creation in mind?
  cta_text: >-
    Whether it's a single meaningful piece or a larger project, Ghada and her
    team would love to hear about it.

custom:
  title: Custom Projects & Professional Orders
  description: >-
    Bespoke handmade work and larger orders from GK Atelier: personalized
    gifts, bridal details and baby sets for individuals, and embellishment,
    decorative fabric elements and handmade components for ateliers,
    designers, event planners and businesses. Enquire on WhatsApp.
  eyebrow: Bespoke work
  heading: Custom Projects & Professional Orders
  lead: >-
    From a single personalized piece to handmade components in larger
    quantities, every project begins with a conversation. Share the details
    below and a WhatsApp message will be prepared for you to review and send.
  audiences_label: Who the atelier works with
  audiences:
    - eyebrow: For individuals
      title: Pieces made for your moments
      text: Personal creations shaped around a name, an occasion or an idea.
      items:
