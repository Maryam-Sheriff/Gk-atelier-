about:
  title: عن غادة خليل — فنانة ومعلّمة وحِرفية
  description: >-
    تعرّفوا على غادة خليل، الفنانة ومعلّمة الفن وراء GK Atelier، بخبرة تتجاوز
    ثلاثين عامًا في التدريس، وعمل مع المصممين وأتيليهات فساتين الزفاف والسهرة.
  eyebrow: عن غادة
  heading: تعرّفوا على غادة خليل
  lead: فنانة ومعلّمة وحِرفية، كرّست حياتها للإبداع والحِرفة.
  work_caption: قطع من الأتيليه
  story_title: قصتها
  # Ghada's biography, paragraph by paragraph.
  bio:
    - >-
      بالنسبة إلى غادة خليل، الفن اليدوي أكثر من مجرد مهارة؛ إنه عالم من
      الإبداع والخبرة والاهتمام بأدق التفاصيل.
    - >-
      بخبرة تتجاوز ثلاثين عامًا في تدريس الفن، أمضت غادة عقودًا في تعميق فهمها
      للتقنيات الفنية والخامات والتكوين والعملية الإبداعية. وإلى جانب مسيرتها
      في التدريس، عملت مع أسماء رائدة في عالم التصميم في الشرق الأوسط، وتعاونت
      مع العديد من الأتيليهات المتخصصة في فساتين الزفاف والسهرة، فأسهمت في عالم
      الأزياء الراقية والحِرف الزخرفية.
    - >-
      ولا تقتصر خبرتها على تقنية واحدة؛ فمن الرسم على الحرير والتطريز إلى
      المكرمية والكروشيه والتريكو والزهور القماشية والأبليكات الجاهزة، تجمع غادة
      بين المعرفة الفنية والخبرة العملية في طيف واسع من الإبداعات اليدوية.
    - >-
      وقد عملت مع أقمشة تتراوح بين أرقّ الخامات وأكثرها صعوبة، مكيّفةً تقنياتها
      بما يناسب الخامة والتصميم واللمسة النهائية المطلوبة. وسواء كانت تصنع
      تفصيلة زخرفية دقيقة، أو هدية مخصّصة، أو قطعة نسيج حسب الطلب، فإنها تتعامل
      مع كل مشروع بعناية والتزام راسخ بالجودة.
    - >-
      واليوم، تقود غادة فريقًا محترفًا من الحِرفيين يعملون تحت إشرافها، ما يتيح
      لـ GK Atelier أن يجمع بين العناية الشخصية بالتفاصيل والقدرة على تلبية
      كميات إنتاج مختلفة، بحسب التصميم ومتطلبات كل مشروع.
    - >-
      فلسفتها بسيطة: كل قطعة تستحق الاهتمام والمهارة والقلب. وهي تؤمن بأن أصغر
      التفاصيل قادرة على أن تُحدث فرقًا في العمل كله، وأن الجودة تنبع من فهم
      الخامات واحترام الحِرفة والحرص على النتيجة النهائية.
    - >-
      في GK Atelier، يبدأ كل مشروع بفكرة، ليصبح إبداعًا تشكّله الخبرة والإبداع
      والحب الصادق للفن اليدوي.
  quote: كل قطعة تستحق الاهتمام والمهارة والقلب.
  signoff: GK Atelier — غادة خليل. إبداعات يدوية، مصنوعة بعناية.
  highlights_title: خبرة وراء كل قطعة
  crafts_eyebrow: التقنيات
  crafts_title: طيف واسع من الحِرف
  crafts_text: تجمع غادة في كل منها بين المعرفة الفنية والخبرة العملية.
  crafts:
    - الرسم على الحرير
    - التطريز
    - شغل الخرز والتزيين
    - المكرمية
    - الكروشيه
    - التريكو
    - الزهور القماشية
    - الأبليكات الجاهزة
  work_eyebrow: الأعمال
  work_title: من الأتيليه
  process_title: داخل الأتيليه
  process_text: مساحة العمل والأدوات والقطع وهي تتشكّل.
  cta_title: هل لديكم فكرة إبداع؟
  cta_text: >-
    سواء كانت قطعة واحدة تحمل معنى خاصًا أو مشروعًا أكبر، يسعد غادة وفريقها
    أن يسمعوا عنها.

