home:
  title: فن يدوي راقٍ في مصر والخليج
  description: >-
    GK Atelier بإشراف غادة خليل: تفاصيل العروس، والتطريز وتفاصيل الأزياء
    الراقية، والزهور القماشية، والمكرمية، وأطقم المواليد، واللوحات الفنية،
    والكروشيه، والهدايا المخصّصة — مصنوعة يدويًا بإشراف فنانة تتجاوز خبرتها
    ثلاثين عامًا. استفسروا عبر واتساب من مصر والخليج.
  hero_eyebrow: GK Atelier — غادة خليل
  hero_title_start: إبداعات يدوية
  hero_title_accent: للحظات لها معنى.
  hero_text: >-
    حيث تلتقي الخبرة الفنية بجمال الحِرفة اليدوية. من تفاصيل الأزياء الراقية
    الدقيقة إلى الهدايا المخصّصة، تُصنع كل قطعة بعناية ومهارة وشغف بالجودة.
  hero_primary: اكتشفوا إبداعاتنا
  hero_secondary: ناقشوا مشروعكم عبر واتساب
  credential_value: "٣٠"
  credential_text: عامًا وأكثر من الخبرة في تدريس الفن، وراء كل قطعة
  expertise_eyebrow: الأتيليه
  expertise_title: فن يدوي راقٍ، متجذّر في الخبرة
  expertise_text: >-
    تقود GK Atelier غادة خليل، الفنانة ومعلّمة الفن، مع فريق محترف من
    الحِرفيين يعملون تحت إشرافها.
  expertise:
    - kicker: أكثر من ٣٠ عامًا
