    - eyebrow: للمحترفين والأنشطة التجارية
      title: شريك يدوي يُعتمد عليه
      text: >-
        خبرة مع أتيليهات فساتين الزفاف والسهرة، ومع الأقمشة الرقيقة والتطريز،
        وفريق يعمل تحت إشراف غادة.
      items:
        - أتيليهات فساتين الزفاف والسهرة
        - مصممو الأزياء
        - منظمو المناسبات
        - البوتيكات ومتاجر الهدايا
        - مكوّنات يدوية أو كميات أكبر
  assessed_note: >-
    تُدرس طاقة الإنتاج والأسعار ومدد التنفيذ والحد الأدنى للكميات وتوفّر
    الخامات لكل مشروع على حدة، ليحصل كل طلب على إجابة صادقة عمّا هو ممكن.
  how_title: كيف تتم العملية
  how:
    - املؤوا النموذج بأكبر قدر ممكن من التفاصيل.
    - يفتح واتساب ورسالتكم مكتوبة. أرفقوا أي صور مرجعية، وراجعوها، ثم اضغطوا إرسال.
    - تردّ غادة أو فريقها لمناقشة إمكانية التنفيذ والسعر والموعد.
  enquiry_notice_title: استفسار وليس طلبًا مؤكدًا
