privacy:
  title: إشعار الخصوصية
  description: كيف يتعامل موقع GK Atelier مع بياناتكم.
  heading: إشعار الخصوصية
  # Change this date whenever the privacy text changes (YYYY-MM-DD).
  updated_on: "2026-10-20"
  updated: "آخر تحديث: {date}"
  sections:
    - title: باختصار
      text:
        - >-
          لا يطلب هذا الموقع منكم إنشاء حساب، ولا يقبل مدفوعات، ولا يستخدم ملفات
          تعريف الارتباط الإعلانية أو التحليلية.
    - title: نموذج الاستفسار وواتساب
      text:
        - >-
          عند استخدام نموذج المشاريع، تبقى بياناتكم (مثل الاسم ووسيلة التواصل
          ووصف المشروع) في متصفحكم. وعند الضغط على الزر توضع في رسالة واتساب على
          جهازكم، ولا يُرسل شيء حتى تختاروا إرسال الرسالة بأنفسكم.
        - >-
          بعد إرسال الرسالة، تصل إلى GK Atelier عبر واتساب وتخضع لشروط واتساب
          وسياسة الخصوصية الخاصة به. تراجع غادة أو فريقها جميع الاستفسارات،
          وتُستخدم فقط للرد على استفساركم وترتيب طلبكم، ولا يُؤكَّد أي طلب إلا بعد
          الاتفاق على التفاصيل.
        - >-
          تُرفق الصور المرجعية مباشرة في واتساب ولا تُرفع أبدًا على هذا الموقع.
          ولا تُنشر صور العملاء أو مراجع مشاريعهم دون إذنهم.
    - title: ما يُحفظ على جهازكم
      text:
        - >-
          يتذكّر الموقع اختياركم للغة (العربية أو الإنجليزية) في التخزين المحلي
          لمتصفحكم، ليفتح الموقع بلغتكم في المرة القادمة. ويمكنكم مسحه في أي وقت
          من إعدادات المتصفح.
    - title: الاستضافة
      text:
        - >-
          كمعظم المواقع، قد يحتفظ مزوّد الاستضافة بسجلات تقنية معتادة (مثل
          عناوين IP والصفحات المطلوبة) لأغراض الأمان ولضمان عمل الموقع.
    - title: الأسئلة
      text:
        - >-
          إن كان لديكم سؤال عن بياناتكم، أو رغبتم في حذف رسائلكم، تواصلوا مع
          الأتيليه عبر واتساب.

