# ─────────────────────────────────────────────────────────────────────────────
#  Photographs for the homepage and the About page
#
#  1. Copy the photo into the images/atelier folder (JPG, PNG or WebP —
#     large originals are fine, the website makes smaller copies itself).
#  2. Write its path after "src:" and describe what it shows after "en:" and
#     "ar:" (this description is read aloud to blind visitors and helps Google).
#  Only real photographs of Ghada's own work belong here. Any slot left empty
#  shows a clearly labelled "photograph coming soon" placeholder.
# ─────────────────────────────────────────────────────────────────────────────

# The top of the homepage. Left empty (as now), the homepage opens with the
# GK Atelier logo, large and centred, with a gentle shimmer. To open with a
# photograph instead, write its path here (a portrait photo works best): it
# then fills half the screen beside the opening words.
hero:
  src: ""
  alt:
    en: ""
    ar: ""

# The photograph beside "Made for your vision" (custom and professional
# projects) on the homepage.
custom:
  src: images/products/personalized-embroidery-hoops/1.jpg
  alt:
    en: Hand-embroidered hoops with names, flowers and little illustrations, each finished with a ribbon bow
    ar: طارات مطرّزة يدويًا بالأسماء والزهور والرسومات الصغيرة، تزيّن كلًّا منها فيونكة من الشريط

# A photograph of Ghada, ideally at work. Used on the homepage and About page.
ghada:
  src: ""
  alt:
    en: ""
    ar: ""

# "A glimpse into the atelier" on the homepage — 6 photographs work best:
# a mix of finished pieces and close-ups of stitching, threads and textures.
glimpse:
  - src: images/products/katb-el-ketab-calendar-handkerchief/1.jpg
    alt:
      en: Embroidered katb el-ketab handkerchief with a bride and groom under a floral arch, the gown in tulle and lace
      ar: منديل كتب كتاب مطرّز بعروسين تحت قوس من الورود، والفستان من التول والدانتيل
  - src: images/products/embroidered-name-mini-hoop/1.jpg
    alt:
      en: Mini embroidery hoop with a name in pink letters and small flowers
      ar: طارة تطريز صغيرة عليها اسم بحروف وردية وزهور صغيرة
  - src: images/products/macrame-shoe-rack-with-hooks/1.jpg
    alt:
      en: Macramé panel knotted in a diamond pattern on a shoe rack with hooks
      ar: لوح مكرمية معقود بنقش المعيّنات على رفّ أحذية بعلّاقات
  - src: images/products/baby-breath-ring-tray/1.jpg
    alt:
      en: Round black ring tray with pearls, baby's breath and white Arabic lettering
      ar: صينية دبل دائرية سوداء باللؤلؤ وزهور الجبسوفيلا وحروف عربية بيضاء
  - src: images/products/macrame-ramadan-lanterns/1.jpg
    alt:
      en: Three ivory macramé Ramadan lanterns
      ar: ثلاثة فوانيس رمضان من المكرمية العاجية
  - src: images/products/abstract-gold-textured-painting/1.jpg
    alt:
      en: Abstract painting with a textured gold band between beige and black
      ar: لوحة تجريدية بشريط ذهبي بارز بين البيج والأسود

