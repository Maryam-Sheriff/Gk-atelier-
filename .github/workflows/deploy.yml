name: Publish to GitHub Pages

# Every change on main (a new product, a photo, a text edit) rebuilds the site
# and publishes it. The build checks the content files first: if one has a
# mistake, it stops with a plain message and the live site stays as it was.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized photos are cached between runs, so only new photos are processed.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ hashFiles('images/**') }}
          restore-keys: images-
      - name: Build the site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is still "Deploy from a branch",
      # GitHub also publishes the bare repository after every push, which
      # replaces the site with the README and makes every inner page a 404.
      # Publishing only after that build has finished keeps the real site
      # live. Once the source is "GitHub Actions" there is nothing to wait for.
      - name: Wait for GitHub's own branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[] | select((.path | startswith("dynamic/pages")) and .status != "completed")] | length' || echo 0)
            if [ "$busy" = "0" ]; then exit 0; fi
            echo "GitHub's branch build is still running; publishing once it has finished."
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
