name: Publish to GitHub Pages

# Every change on main (a new product, a photo, a text edit) rebuilds the site
# and publishes it. The build checks the content files first: if one has a
# mistake, it stops with a plain message and the live site stays as it was.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized photos are cached between runs, so only new photos are processed.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ hashFiles('images/**') }}
          restore-keys: images-
      - name: Build the site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
